<!doctype html>
<meta charset="utf-8" />
<meta name="color-scheme" content="dark light" />
<meta name="robots" content="noindex" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Home</title>
<!-- fetch at parse time: the dial lives in shadow DOM, which would request the font late -->
<link rel="preload" href="DepartureMono-Regular.woff2" as="font" type="font/woff2" crossorigin />

<style>
  /* tilde (github.com/xvvvyz/tilde), Catppuccin Mocha + bundled pixel font:
     Firefox can't see Nix-profile system fonts */
  @font-face {
    font-family: 'Departure Mono';
    src: url('DepartureMono-Regular.woff2') format('woff2');
    font-display: block; /* local file: brief invisible text beats a fallback-font flash */
  }

  :root {
    /* Catppuccin Mocha; mantle matches the Firefox toolbar (userChrome.css) */
    --color-background: #181825;
    --color-text-subtle: #7f849c;
    --color-text: #cdd6f4;
    --font-family: 'Departure Mono', monospace;
    /* pixel font: only multiples of 11px land on its grid */
    --font-size: 22px;
    --color-accent: #f38ba8;
    --transition-speed: 200ms;
    /* names used by the background popup */
    --bg-mantle: #181825;
    --rule: #45475a;
    --muted: #a6adc8;
    --subtext: #bac2de;
    --accent: #cba6f7;
    --space-xs: 0.25rem;
    --space-sm: 0.5rem;
    --space-md: 1rem;
  }

  /* popup buttons */
  .btns {
    display: flex;
    gap: var(--space-sm);
  }
  .btn {
    background: none;
    border: 1px solid var(--rule);
    border-radius: 999px;
    color: var(--muted);
    font-family: var(--font-family);
    font-size: 0.5rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 0.3em 0.9em;
    cursor: pointer;
    transition: color var(--transition-speed), border-color var(--transition-speed);
  }
  .btn:hover,
  .btn:focus-visible {
    color: var(--accent);
    border-color: var(--accent);
  }

  /* custom background layer, tuned from the settings popup */
  .bg {
    position: fixed;
    inset: 0;
    z-index: -1;
    background: center / cover no-repeat;
    transform: scale(1.06); /* hide blurred edges */
    pointer-events: none;
  }

  .bg-menu {
    position: fixed;
    top: var(--space-md);
    right: var(--space-md);
    z-index: 1;
  }
  #bg-open { display: grid; place-items: center; padding: 0.45em; }
  .bg-panel {
    position: absolute;
    top: calc(100% + var(--space-sm));
    right: 0;
    width: 16rem;
    padding: var(--space-md);
    display: grid;
    gap: var(--space-md);
    background: var(--bg-mantle);
    border: 1px solid var(--rule);
    border-radius: 12px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
  }
  .bg-panel[hidden] { display: none; }
  .bg-panel label {
    display: grid;
    gap: var(--space-xs);
    font-size: 0.5rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .bg-panel label div { display: flex; justify-content: space-between; }
  .bg-panel label span { color: var(--subtext); text-transform: none; }
  .bg-panel input[type="range"] { width: 100%; accent-color: var(--accent); }
</style>

<script type="module">
  /** @type {AppConfig} */
  const CONFIG = {
    commandPathDelimiter: '/',
    commandSearchDelimiter: ' ',
    defaultSearchTemplate: 'https://www.google.com/search?q={}',
    openLinksInNewTab: false,
    suggestionLimit: 4,
  };

  // named entries appear on the dial, in insertion order. suggestions are curated.
  /** @type {Map<string, Command>} */
  // prettier-ignore
  const COMMANDS = new Map([
    ['a', { name: 'AI', suggestions: ['a/chatgpt', 'a/gemini', 'a/deepseek', 'a/notebooklm'], url: 'https://claude.ai/new' }],
    ['a/chatgpt', { url: 'https://chatgpt.com/' }],
    ['a/gemini', { url: 'https://gemini.google.com/app' }],
    ['a/deepseek', { url: 'https://chat.deepseek.com/' }],
    ['a/notebooklm', { url: 'https://notebooklm.google.com/' }],
    ['d', { name: 'Discord', url: 'https://discord.com/channels/@me' }],
    ['e', { name: 'Shopee', searchTemplate: '/search?keyword={}', url: 'https://shopee.vn/user/purchase' }],
    ['g', { name: 'GitHub', searchTemplate: '/search?q={}', suggestions: ['g/trending', 'g/trendshift'], url: 'https://github.com' }],
    ['g/trendshift', { url: 'https://trendshift.io/' }],
    ['h', { name: 'HUST', suggestions: ['h/sis', 'h/ctt', 'h/tkb', 'h/ctsv'], url: 'https://student.hust.edu.vn/learn/timetable' }],
    ['h/sis', { url: 'https://ctt-sis.hust.edu.vn/Students/StudentCheckInputGradeTerm.aspx' }],
    ['h/ctt', { url: 'https://ctt.hust.edu.vn/Services' }],
    ['h/tkb', { url: 'https://hungitb.github.io/tkb-hust/' }],
    ['h/ctsv', { url: 'https://ctsv.hust.edu.vn/#/danh-sach-su-kien' }],
    ['k', { name: 'MATLAB', url: 'https://matlab.mathworks.com/' }],
    ['l', { name: 'Local', suggestions: ['l/dsh'], url: 'http://127.0.0.1:8787/' }],
    ['l/dsh', { url: 'http://127.0.0.1:3080/' }],
    ['m', { name: 'Messenger', url: 'https://www.messenger.com/' }],
    ['n', { name: 'News', suggestions: ['n/hellogithub', 'n/vnlf', 'n/steamdb'], url: 'https://vnexpress.net/khoa-hoc-cong-nghe' }],
    ['n/hellogithub', { url: 'https://hellogithub.com/en' }],
    ['n/vnlf', { url: 'https://vietnamlinuxfamily.net/' }],
    ['n/steamdb', { url: 'https://steamdb.info/' }],
    ['o', { name: 'Overleaf', url: 'https://www.overleaf.com/project' }],
    ['r', { name: 'Translate', searchTemplate: '/?sl=en&tl=vi&text={}&op=translate', url: 'https://translate.google.com/?hl=vi&sl=en&tl=vi&op=translate' }],
    ['s', { name: 'Spotify', searchTemplate: '/search/{}', suggestions: ['s/soundcloud'], url: 'https://open.spotify.com/' }],
    ['s/soundcloud', { url: 'https://soundcloud.com/discover' }],
    ['t', { name: 'Teams', suggestions: ['t/outlook'], url: 'https://teams.microsoft.com/v2/' }],
    ['t/outlook', { url: 'https://outlook.office365.com/mail/' }],
    ['x', { name: 'X', searchTemplate: '/search?q={}', url: 'https://x.com/explore/tabs/trending' }],
    ['y', { name: 'YouTube', searchTemplate: '/results?search_query={}', suggestions: ['y/channels', 'y/lofi'], url: 'https://www.youtube.com/feed/subscriptions' }],
    ['y/channels', { url: 'https://www.youtube.com/feed/channels' }],
    ['y/lofi', { url: 'https://www.youtube.com/watch?v=X4VbdwhkE10' }],
    ['z', { name: 'Zalo', url: 'https://chat.zalo.me/' }],
  ]);

  /**
   * @typedef {object} AppConfig
   * @property {string} commandPathDelimiter
   * @property {string} commandSearchDelimiter
   * @property {string} defaultSearchTemplate
   * @property {boolean} openLinksInNewTab
   * @property {number} suggestionLimit
   */

  /**
   * @typedef {object} Command
   * @property {string} url
   * @property {string=} name
   * @property {string=} searchTemplate
   * @property {string[]=} suggestions
   */

  /**
   * @typedef {object} ParsedQuery
   * @property {string} query
   * @property {string} url
   * @property {string=} key
   * @property {string=} path
   * @property {string=} search
   * @property {string=} splitBy
   */

  /**
   * @param {string} id
   * @returns {HTMLTemplateElement}
   */
  function getTemplate(id) {
    const template = document.getElementById(id);

    if (!(template instanceof HTMLTemplateElement)) {
      throw new Error(`Template #${id} not found`);
    }

    return template;
  }

  const TEMPLATES = {
    command: getTemplate('command-template'),
    commands: getTemplate('commands-template'),
    match: getTemplate('match-template'),
    search: getTemplate('search-template'),
    suggestion: getTemplate('suggestion-template'),
  };

  /**
   * @param {string} value
   * @returns {string}
   */
  function escapeRegexCharacters(value) {
    return value.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
  }

  /**
   * @param {string} template
   * @param {string} search
   * @returns {string}
   */
  function formatSearchUrl(template, search) {
    return template.replace(/{}/g, encodeURIComponent(search));
  }

  /**
   * @param {string} value
   * @returns {boolean}
   */
  function hasProtocol(value) {
    return /^[a-zA-Z]+:\/\//i.test(value);
  }

  /**
   * @param {string} value
   * @returns {boolean}
   */
  function isUrl(value) {
    return /^((https?:\/\/)?[\w-]+(\.[\w-]+)+\.?(:\d+)?(\/\S*)?)$/i.test(value);
  }

  /**
   * @param {string} value
   * @param {string} delimiter
   * @returns {[string, string?]}
   */
  function splitOnce(value, delimiter) {
    const delimiterIndex = value.indexOf(delimiter);

    if (delimiterIndex === -1) return [value];

    return [
      value.slice(0, delimiterIndex),
      value.slice(delimiterIndex + delimiter.length),
    ];
  }

  /**
   * @param {string} raw
   * @param {Map<string, Command>} commands
   * @param {AppConfig} config
   * @returns {ParsedQuery}
   */
  function parseQuery(raw, commands, config) {
    const query = raw.trim();

    if (isUrl(query)) {
      const url = hasProtocol(query) ? query : `https://${query}`;
      return { query, url };
    }

    if (commands.has(query)) {
      const { url } = commands.get(query);
      return { key: query, query, url };
    }

    let splitBy = config.commandSearchDelimiter;
    const [searchKey, rawSearch] = splitOnce(query, splitBy);

    if (commands.has(searchKey)) {
      const command = commands.get(searchKey);
      const template = new URL(command.searchTemplate ?? '', command.url);
      const search = rawSearch.trim();
      const url = formatSearchUrl(decodeURI(template.href), search);
      return { key: searchKey, query, search, splitBy, url };
    }

    splitBy = config.commandPathDelimiter;
    const [pathKey, path] = splitOnce(query, splitBy);

    if (commands.has(pathKey)) {
      const command = commands.get(pathKey);
      const url = `${new URL(command.url).origin}/${path}`;
      return { key: pathKey, path, query, splitBy, url };
    }

    const url = formatSearchUrl(config.defaultSearchTemplate, query);
    return { query, search: query, url };
  }

  /**
   * @param {ParsedQuery} parsedQuery
   * @param {Map<string, Command>} commands
   * @param {AppConfig} config
   * @returns {string[]}
   */
  function collectLocalSuggestions(parsedQuery, commands, config) {
    const parentKey = parsedQuery.query.split(config.commandPathDelimiter)[0];
    const exactMatch = commands.has(parsedQuery.query);
    let suggestions = [
      ...(commands.get(parsedQuery.query)?.suggestions ??
        commands.get(parentKey)?.suggestions ??
        []),
    ];

    if (exactMatch) {
      suggestions = suggestions.filter((suggestion) =>
        suggestion.startsWith(parsedQuery.query)
      );
    }

    for (const [key, command] of commands.entries()) {
      if (key !== parsedQuery.query && !suggestions.includes(key)) {
        if (key.includes(parsedQuery.query)) {
          suggestions.push(key);
        }
      }

      for (const suggestion of command.suggestions ?? []) {
        if (
          suggestion !== parsedQuery.query &&
          !suggestions.includes(suggestion)
        ) {
          if (suggestion.includes(parsedQuery.query)) {
            suggestions.push(suggestion);
          }
        }
      }
    }

    return suggestions.filter((suggestion) =>
      suggestion.includes(parsedQuery.query)
    );
  }

  /**
   * @param {string} search
   * @returns {Promise<string[]>}
   */
  function fetchDuckDuckGoSuggestions(search) {
    return new Promise((resolve) => {
      window.autocompleteCallback = (response) => {
        const suggestions = [];

        for (const item of response) {
          if (item.phrase === search.toLowerCase()) continue;
          suggestions.push(item.phrase);
        }

        resolve(suggestions);
      };

      const script = document.createElement('script');
      document.querySelector('head').appendChild(script);
      script.src = `https://duckduckgo.com/ac/?callback=autocompleteCallback&q=${search}`;
      script.onload = script.remove;

      script.onerror = () => {
        script.remove();
        resolve([]);
      };
    });
  }

  class CommandRing extends HTMLElement {
    #clockInterval = null;

    constructor() {
      super();
      this.attachShadow({ mode: 'open' });
      const componentFragment = TEMPLATES.commands.content.cloneNode(true);
      const commands = componentFragment.querySelector('.commands');

      const entries = [...COMMANDS.entries()].filter(
        ([, { name, url }]) => name && url
      );

      const total = entries.length;

      commands.style.setProperty(
        '--item-size',
        Math.sin(Math.PI / total) / 0.8
      );

      for (const [index, [key, { name, url }]] of entries.entries()) {
        const commandFragment = TEMPLATES.command.content.cloneNode(true);
        const item = commandFragment.querySelector('li');
        const angle = (index / total) * 2 * Math.PI - Math.PI / 2;
        item.style.setProperty('--x', 0.5 + 0.5 * Math.cos(angle));
        item.style.setProperty('--y', 0.5 + 0.5 * Math.sin(angle));

        const commandLink = commandFragment.querySelector('.command');
        commandLink.href = url;
        commandLink.setAttribute('aria-label', name);
        if (CONFIG.openLinksInNewTab) commandLink.target = '_blank';
        commandFragment.querySelector('.key').textContent = key;
        commandFragment.querySelector('.name').textContent = name;
        commands.append(commandFragment);
      }

      this.shadowRoot.append(componentFragment);
      const items = commands.querySelectorAll('li');

      for (const [index] of entries.entries()) {
        const item = items[index];

        item.addEventListener('mouseenter', () => {
          for (const [otherIndex] of entries.entries()) {
            const distance = Math.min(
              Math.abs(otherIndex - index),
              total - Math.abs(otherIndex - index)
            );

            if (distance === 0) {
              items[otherIndex].style.transform =
                'translate(-50%, -50%) scale(1)';
            } else if (distance === 1) {
              items[otherIndex].style.opacity = '0.25';
            } else if (distance === 2) {
              items[otherIndex].style.opacity = '0.5';
            } else if (distance === 3) {
              items[otherIndex].style.opacity = '0.75';
            }
          }
        });

        item.addEventListener('mouseleave', () => {
          for (const otherItem of items) {
            otherItem.style.opacity = '';
            otherItem.style.transform = '';
          }
        });
      }
    }

    connectedCallback() {
      this.#startClock();
    }

    disconnectedCallback() {
      if (this.#clockInterval === null) return;

      clearInterval(this.#clockInterval);
      this.#clockInterval = null;
    }

    #startClock() {
      if (this.#clockInterval !== null) return;

      const hour = this.shadowRoot.querySelector('.hand--hour');
      const minute = this.shadowRoot.querySelector('.hand--minute');
      const second = this.shadowRoot.querySelector('.hand--second');

      const tick = () => {
        const now = new Date();
        const hours = now.getHours() % 12;
        const minutes = now.getMinutes();
        const seconds = now.getSeconds();
        second.style.transform = `rotate(${seconds * 6}deg)`;
        minute.style.transform = `rotate(${(minutes + seconds / 60) * 6}deg)`;
        hour.style.transform = `rotate(${(hours + minutes / 60) * 30}deg)`;
      };

      tick();
      this.#clockInterval = setInterval(tick, 1000);
    }
  }

  class SearchOverlay extends HTMLElement {
    #dialog;
    #form;
    #input;
    #suggestions;
    #lastSuggestions = [];
    #closeController = null;
    #documentController = null;

    constructor() {
      super();
      this.attachShadow({ mode: 'open' });
      const componentFragment = TEMPLATES.search.content.cloneNode(true);
      this.#dialog = componentFragment.querySelector('.dialog');
      this.#form = componentFragment.querySelector('.form');
      this.#input = componentFragment.querySelector('.input');
      this.#suggestions = componentFragment.querySelector('.suggestions');
      this.#form.addEventListener('submit', this.#onSubmit, false);
      this.#input.addEventListener('input', this.#onInput);
      this.#suggestions.addEventListener('click', this.#onSuggestionClick);
      this.shadowRoot.append(componentFragment);
    }

    connectedCallback() {
      if (this.#documentController) return;

      this.#documentController = new AbortController();
      const { signal } = this.#documentController;
      document.addEventListener('keydown', this.#onKeydown, { signal });
      document.addEventListener('paste', this.#onPaste, { signal });
    }

    disconnectedCallback() {
      this.#documentController?.abort();
      this.#documentController = null;
      this.#cancelPendingClose();
    }

    #cancelPendingClose() {
      this.#closeController?.abort();
      this.#closeController = null;
    }

    #reset() {
      this.#input.value = '';
      this.#input.blur();
      this.#suggestions.innerHTML = '';
    }

    #prepareOpen() {
      this.#cancelPendingClose();
      this.#dialog.show();
      this.#input.focus();
    }

    #open() {
      this.#prepareOpen();
      requestAnimationFrame(() => this.#dialog.classList.add('visible'));
    }

    #close() {
      this.#cancelPendingClose();
      this.#closeController = new AbortController();
      this.#dialog.classList.remove('visible');
      this.#reset();

      this.#dialog.addEventListener(
        'transitionend',
        () => {
          if (!this.#dialog.classList.contains('visible')) {
            this.#dialog.close();
          }

          this.#closeController = null;
        },
        { once: true, signal: this.#closeController.signal }
      );
    }

    #hideImmediately() {
      this.#cancelPendingClose();
      this.#reset();
      this.#dialog.close();
    }

    #execute(query) {
      const parsedQuery = parseQuery(query, COMMANDS, CONFIG);
      if (CONFIG.openLinksInNewTab) window.open(parsedQuery.url, '_blank', 'noopener noreferrer');
      else location.href = parsedQuery.url;
      this.#close();
    }

    #focusNextSuggestion(previous = false) {
      const activeElement = this.shadowRoot.activeElement;
      let nextIndex;

      if (activeElement.dataset.index) {
        const activeIndex = Number(activeElement.dataset.index);
        nextIndex = previous ? activeIndex - 1 : activeIndex + 1;
      } else {
        nextIndex = previous ? this.#suggestions.childElementCount - 1 : 0;
      }

      const nextItem = this.#suggestions.children[nextIndex];
      if (nextItem) nextItem.querySelector('.suggestion').focus();
      else this.#input.focus();
    }

    #onInput = async () => {
      const parsedQuery = parseQuery(this.#input.value, COMMANDS, CONFIG);

      if (!parsedQuery.query) {
        this.#close();
        return;
      }

      let suggestions = collectLocalSuggestions(parsedQuery, COMMANDS, CONFIG);

      const suggestionsWithStale = [
        ...suggestions,
        ...this.#lastSuggestions.filter((suggestion) =>
          suggestion.includes(parsedQuery.query)
        ),
      ].slice(0, CONFIG.suggestionLimit);

      if (suggestionsWithStale.length) {
        this.#renderSuggestions(suggestionsWithStale, parsedQuery.query);
      } else if (!(parsedQuery.search?.length > 1)) {
        this.#suggestions.innerHTML = '';
      }

      if (parsedQuery.search?.length > 1) {
        const results = await fetchDuckDuckGoSuggestions(parsedQuery.search);
        const currentQuery = parseQuery(this.#input.value, COMMANDS, CONFIG);
        if (currentQuery.query !== parsedQuery.query) return;

        const duckDuckGoSuggestions = parsedQuery.splitBy
          ? results.map(
              (search) => `${parsedQuery.key}${parsedQuery.splitBy}${search}`
            )
          : results;

        this.#lastSuggestions = duckDuckGoSuggestions;

        suggestions = [...suggestions, ...duckDuckGoSuggestions].slice(
          0,
          CONFIG.suggestionLimit
        );

        if (suggestions.length) {
          this.#renderSuggestions(suggestions, parsedQuery.query);
        } else {
          this.#suggestions.innerHTML = '';
        }
      }
    };

    #onPaste = (event) => {
      if (this.#dialog.classList.contains('visible')) return;
      const text = event.clipboardData?.getData('text');
      if (!text) return;
      event.preventDefault();
      this.#open();
      this.#input.value = text;
      this.#onInput();
    };

    #onKeydown = (event) => {
      if (event.target.closest?.('.bg-menu')) return;

      if (!this.#dialog.classList.contains('visible')) {
        if (event.key === 'Escape') {
          if (this.#dialog.open) {
            this.#hideImmediately();
          }

          return;
        }

        this.#prepareOpen();

        requestAnimationFrame(() => {
          // close the search dialog before the next repaint if a character is
          // not produced (e.g. if you type shift, control, alt etc.)
          if (!this.#input.value) {
            this.#hideImmediately();
          } else {
            this.#dialog.classList.add('visible');
          }
        });

        return;
      }

      if (event.key === 'Escape') {
        this.#close();
        return;
      }

      const alt = event.altKey ? 'alt-' : '';
      const ctrl = event.ctrlKey ? 'ctrl-' : '';
      const meta = event.metaKey ? 'meta-' : '';
      const shift = event.shiftKey ? 'shift-' : '';
      const modifierPrefixedKey = `${alt}${ctrl}${meta}${shift}${event.key}`;

      if (/^(ArrowDown|Tab|ctrl-n)$/.test(modifierPrefixedKey)) {
        event.preventDefault();
        this.#focusNextSuggestion();
        return;
      }

      if (/^(ArrowUp|ctrl-p|shift-Tab)$/.test(modifierPrefixedKey)) {
        event.preventDefault();
        this.#focusNextSuggestion(true);
      }
    };

    #onSubmit = () => {
      this.#execute(this.#input.value);
    };

    #onSuggestionClick = (event) => {
      const button = event.target.closest('.suggestion');
      if (!button) return;
      this.#execute(button.dataset.suggestion);
    };

    #renderSuggestions(suggestions, query) {
      const focusedSuggestion =
        this.shadowRoot.activeElement?.dataset?.suggestion;

      this.#suggestions.innerHTML = '';
      const pattern = new RegExp(escapeRegexCharacters(query), 'i');

      for (const [index, suggestion] of suggestions.entries()) {
        const suggestionFragment = TEMPLATES.suggestion.content.cloneNode(true);
        const button = suggestionFragment.querySelector('.suggestion');
        button.dataset.index = index;
        button.dataset.suggestion = suggestion;
        const matched = suggestion.match(pattern);

        if (matched) {
          const matchFragment = TEMPLATES.match.content.cloneNode(true);
          const match = matchFragment.querySelector('.match');
          const beforeMatch = suggestion.slice(0, matched.index);

          const afterMatch = suggestion.slice(
            matched.index + matched[0].length
          );

          match.textContent = matched[0];
          match.insertAdjacentText('beforebegin', beforeMatch);
          match.insertAdjacentText('afterend', afterMatch);
          button.append(matchFragment);
        } else {
          button.textContent = suggestion;
        }

        this.#suggestions.append(suggestionFragment);
      }

      if (focusedSuggestion) {
        const buttonToRefocus = this.#suggestions.querySelector(
          `[data-suggestion="${CSS.escape(focusedSuggestion)}"]`
        );

        buttonToRefocus?.focus();
      }
    }
  }

  // render the dial only once the pixel font is ready (no fallback-font flash)
  await document.fonts.load("1rem 'Departure Mono'").catch(() => {});
  customElements.define('commands-component', CommandRing);
  customElements.define('search-component', SearchOverlay);
</script>

<template id="commands-template">
  <style>
    nav {
      --dial-size: min(55vh, 55vw);
      align-items: center;
      box-sizing: border-box;
      display: flex;
      justify-content: center;
      min-height: 100dvh;
      position: relative;
      width: 100%;
    }

    .commands {
      aspect-ratio: 1;
      height: var(--dial-size);
      list-style: none;
      margin: 0;
      padding: 0;
      position: relative;
    }

    .commands li {
      border-radius: 50%;
      height: calc(var(--item-size) * 100%);
      left: calc(var(--x) * 100%);
      position: absolute;
      top: calc(var(--y) * 100%);
      transform: translate(-50%, -50%) scale(0.8);
      transition:
        opacity var(--transition-speed),
        transform var(--transition-speed);
      width: calc(var(--item-size) * 100%);
    }

    .command {
      align-items: center;
      border-radius: 50%;
      color: var(--color-text);
      display: flex;
      height: 100%;
      justify-content: center;
      outline: 0;
      position: relative;
      text-align: center;
      text-decoration: none;
      width: 100%;
    }

    .key {
      color: var(--color-text-subtle);
      position: absolute;
      transition:
        opacity var(--transition-speed),
        transform var(--transition-speed);
    }

    .command:where(:focus, :hover) .key {
      opacity: 0;
      pointer-events: none;
      transform: translateY(1.5em) scale(0.9);
    }

    .name {
      opacity: 0;
      pointer-events: none;
      transform: translateY(-1.5em) scale(0.9);
      transition:
        opacity var(--transition-speed),
        transform var(--transition-speed);
    }

    .command:where(:focus, :hover) .name {
      opacity: 1;
      transform: translateY(0);
    }

    .clock {
      aspect-ratio: 1;
      height: calc(var(--dial-size) * 0.85);
      left: 50%;
      pointer-events: none;
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    .hand {
      background: var(--color-text);
      border-radius: 2px;
      bottom: 50%;
      left: 50%;
      position: absolute;
      transform-origin: bottom center;
    }

    .hand--hour {
      height: 30%;
      width: 3px;
      margin-left: -1.5px;
    }

    .hand--minute {
      height: 40%;
      width: 2px;
      margin-left: -1px;
    }

    .hand--second {
      background: var(--color-accent);
      height: 45%;
      width: 1px;
      margin-left: -0.5px;
    }

    .dot {
      background: var(--color-text);
      border-radius: 50%;
      height: 6px;
      left: 50%;
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 6px;
    }
  </style>
  <nav>
    <menu class="commands"></menu>
    <div class="clock">
      <div class="hand hand--hour"></div>
      <div class="hand hand--minute"></div>
      <div class="hand hand--second"></div>
      <div class="dot"></div>
    </div>
  </nav>
</template>

<template id="command-template">
  <li>
    <a class="command" rel="noopener noreferrer" aria-label="">
      <span class="key" aria-hidden="true"></span>
      <span class="name"></span>
    </a>
  </li>
</template>

<template id="search-template">
  <style>
    input,
    button {
      -moz-appearance: none;
      font-family: var(--font-family);
      -webkit-appearance: none;
      background: transparent;
      border: 0;
      display: block;
      outline: 0;
    }

    .dialog {
      align-items: center;
      background: rgba(24, 24, 37, 0.92);
      border: none;
      display: none;
      flex-direction: column;
      height: 100%;
      justify-content: center;
      left: 0;
      opacity: 0;
      padding: 0;
      top: 0;
      transform: translateY(10px);
      transition:
        opacity var(--transition-speed),
        transform var(--transition-speed);
      width: 100%;
    }

    .dialog[open] {
      display: flex;
    }

    .dialog.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .form {
      width: 100%;
    }

    .sr-only {
      clip: rect(0 0 0 0);
      clip-path: inset(50%);
      height: 1px;
      overflow: hidden;
      position: absolute;
      white-space: nowrap;
      width: 1px;
    }

    .input {
      color: var(--color-text);
      font-size: 2rem;
      padding: 0;
      text-align: center;
      width: 100%;
    }

    .suggestions {
      align-items: center;
      display: flex;
      flex-direction: column;
      flex-wrap: wrap;
      justify-content: center;
      list-style: none;
      margin: 1rem 0 0;
      overflow: hidden;
      padding: 0;
    }

    .suggestion {
      color: var(--color-text);
      cursor: pointer;
      font-size: 1rem;
      padding: 1rem;
      position: relative;
      transition: color var(--transition-speed);
      white-space: nowrap;
      z-index: 1;
    }

    .suggestion:where(:focus, :hover) {
      color: var(--color-background);
    }

    .suggestions:hover .suggestion:focus:not(:hover) {
      color: var(--color-text);
    }

    .suggestion::before {
      background-color: var(--color-text);
      border-radius: 1em;
      content: ' ';
      inset: 0.8em 0.4em;
      opacity: 0;
      position: absolute;
      transform: translateY(0.3em) scale(0.9);
      transition:
        opacity var(--transition-speed),
        transform var(--transition-speed);
      z-index: -1;
    }

    .suggestion:where(:focus, :hover)::before {
      opacity: 1;
      transform: translateY(0);
    }

    .suggestions:hover .suggestion:focus:not(:hover)::before {
      opacity: 0;
      transform: translateY(0.3em) scale(0.9);
    }

    .match {
      color: var(--color-text-subtle);
      transition: color var(--transition-speed);
    }

    .suggestion:where(:focus, :hover) .match {
      color: var(--color-background);
    }

    .suggestions:hover .suggestion:focus:not(:hover) .match {
      color: var(--color-text-subtle);
    }

    @media (min-width: 700px) {
      .suggestions {
        flex-direction: row;
      }
    }
  </style>
  <dialog class="dialog" aria-label="Search">
    <form autocomplete="off" class="form" method="dialog" spellcheck="false">
      <label for="search-input" class="sr-only">Search</label>
      <input class="input" id="search-input" type="text" />
      <menu class="suggestions"></menu>
    </form>
  </dialog>
</template>

<template id="suggestion-template">
  <li>
    <button class="suggestion" type="button"></button>
  </li>
</template>

<template id="match-template">
  <span class="match"></span>
</template>

<style>
  html {
    background-color: var(--color-background);
    font-family: var(--font-family);
    font-size: var(--font-size);
    line-height: 1.4;
    user-select: none;
    font-synthesis: none; /* no fake bold on the pixel font */
  }

  body {
    margin: 0;
  }
</style>

<div class="bg" id="bg" aria-hidden="true"></div>

<div class="bg-menu">
  <button class="btn" id="bg-open" type="button" aria-expanded="false" aria-controls="bg-panel" aria-label="Background" title="Background"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg></button>
  <div class="bg-panel" id="bg-panel" hidden>
    <div class="btns">
      <button class="btn" id="bg-pick" type="button">Choose image</button>
      <button class="btn" id="bg-reset" type="button">Default</button>
    </div>
    <label><div>Blur <span id="bg-blur-val"></span></div>
      <input type="range" id="bg-blur" min="0" max="30" step="1" /></label>
    <label><div>Opacity <span id="bg-opacity-val"></span></div>
      <input type="range" id="bg-opacity" min="0" max="100" step="1" /></label>
    <label><div>Brightness <span id="bg-bright-val"></span></div>
      <input type="range" id="bg-bright" min="10" max="100" step="1" /></label>
    <input type="file" id="bg-file" accept="image/*" hidden />
  </div>
</div>
<commands-component></commands-component>
<search-component></search-component>

<script>
  // custom background: image Blob in Cache API (no localStorage size limit), sliders in localStorage
  const bgEl = document.getElementById("bg");
  const bgOpen = document.getElementById("bg-open");
  const bgPanel = document.getElementById("bg-panel");
  const bgPick = document.getElementById("bg-pick");
  const bgReset = document.getElementById("bg-reset");
  const bgFile = document.getElementById("bg-file");
  const BG_KEY = "/__bg";
  const BG_DEFAULTS = { blur: 0, opacity: 100, bright: 60 };
  const BG_UNITS = { blur: "px", opacity: "%", bright: "%" };
  let bgUrl = "";
  let bgOpts = { ...BG_DEFAULTS };
  try { Object.assign(bgOpts, JSON.parse(localStorage.getItem("newtab-bg") || "{}")); } catch (e) {}

  function renderBgOpts() {
    bgEl.style.filter = `blur(${bgOpts.blur}px) brightness(${bgOpts.bright}%)`;
    bgEl.style.opacity = bgOpts.opacity / 100;
    for (const k in BG_DEFAULTS) {
      document.getElementById(`bg-${k}`).value = bgOpts[k];
      document.getElementById(`bg-${k}-val`).textContent = bgOpts[k] + BG_UNITS[k];
    }
  }

  function applyBg(blob) {
    if (bgUrl) URL.revokeObjectURL(bgUrl);
    bgUrl = blob ? URL.createObjectURL(blob) : "";
    bgEl.style.backgroundImage = bgUrl ? `url("${bgUrl}")` : "none";
  }

  async function loadBg() {
    try {
      const res = await (await caches.open("newtab")).match(BG_KEY);
      if (res) applyBg(await res.blob());
    } catch (e) { /* storage unavailable: keep gradient */ }
  }

  for (const k in BG_DEFAULTS) {
    document.getElementById(`bg-${k}`).addEventListener("input", (e) => {
      bgOpts[k] = Number(e.target.value);
      renderBgOpts();
      try { localStorage.setItem("newtab-bg", JSON.stringify(bgOpts)); } catch (e) {}
    });
  }

  function toggleBgPanel(open) {
    bgPanel.hidden = !open;
    bgOpen.setAttribute("aria-expanded", open);
  }
  bgOpen.addEventListener("click", () => toggleBgPanel(bgPanel.hidden));
  document.addEventListener("click", (e) => {
    if (!e.target.closest(".bg-menu")) toggleBgPanel(false);
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") toggleBgPanel(false);
  });

  bgPick.addEventListener("click", () => bgFile.click());
  bgFile.addEventListener("change", async () => {
    const file = bgFile.files[0];
    bgFile.value = "";
    if (!file) return;
    applyBg(file);
    try { await (await caches.open("newtab")).put(BG_KEY, new Response(file)); } catch (e) {}
  });
  bgReset.addEventListener("click", async () => {
    applyBg(null);
    bgOpts = { ...BG_DEFAULTS };
    renderBgOpts();
    try { localStorage.removeItem("newtab-bg"); } catch (e) {}
    try { await (await caches.open("newtab")).delete(BG_KEY); } catch (e) {}
  });
  renderBgOpts();
  loadBg();
</script>
