"$schema" = "https://starship.rs/config-schema.json"

add_newline = false
palette = "catppuccin_mocha"

format = """
[╭─](bold overlay2) $directory$git_branch$python$nix_shell
[╰─](bold overlay2) 
"""
# format = """
# [╭─](overlay0) $os$directory$git_branch$python$nix_shell
# [╰─](overlay0) 
# """

# format = """
# [╭─](purple) $os$directory$git_branch$python$nix_shelll
# [╰─](purple) $character
# """
[fill]
disabled = false
symbol = ' ∙'
style = 'rosewater'

[directory]
style = "bold mauve"

[line_break]
disabled = false

[git_branch]
symbol = " "
style = "peach"
format = "[- ](bold overlay2)[$symbol$branch]($style) "

[os]
disabled = false
style = 'mauve'
format = '[$symbol ]($style)'

[python]
symbol = " "
style = "yellow"
format = "[- ](bold overlay2)[${symbol}${version}( ($virtualenv))]($style) "
version_format = "v${raw}"
python_binary = ["python3", "python"]
detect_extensions = ["py", "ipynb"]
detect_files = [
  ".python-version",
  "Pipfile",
  "__init__.py",
  "pyproject.toml",
  "requirements.txt",
  "setup.py",
  "tox.ini",
  "uv.lock",
]
detect_folders = [".venv", "venv"]
generic_venv_names = [".venv", "venv"]

[nix_shell]
symbol = " "
style = "sapphire"
format = "[- ](bold overlay2)[$symbol$state( ($name))]($style) "
heuristic = false

[time]
disabled = false
time_format = '%R'
style = 'rosewater'
format = '[ $time]($style)'

[character]
success_symbol = "[󰄛](green)"
error_symbol = "[󰄛](red)"

[localip]
ssh_only = false
format = '@[$localipv4](bold red) '
disabled = false

[os.symbols]
Windows = ''
Ubuntu = '󰕈'
openSUSE = ''
Raspbian = '󰐿'
Mint = '󰣭'
Macos = ''
Manjaro = ''
Linux = '󰌽'
Gentoo = '󰣨'
Fedora = '󰣛'
Alpine = ''
Amazon = ''
Android = ''
Arch = '󰣇'
Artix = '󰣇'
CentOS = ''
Debian = '󰣚'
Redhat = '󱄛'
RedHatEnterprise = '󱄛'
NixOS       = ''
Pop         = ''
EndeavourOS = ''
Kali        = ''
FreeBSD     = ''
Elementary  = ''
Zorin       = ''
Unknown     = '󰋖'

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
red = "#f38ba8"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
sapphire = "#74c7ec"
blue = "#89b4fa"
mauve = "#cba6f7"
overlay0 = "#6c7086"
overlay2 = "#9399b2"
