backend = "glx";
vsync = false;

# Rounded corners
corner-radius = 12;
round-borders = 1;

# Shadows
shadow = true;
shadow-radius = 12;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-opacity = 0.3;
shadow-color = "#000000";
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'i3bar'",
  "class_g = 'rofi'",
  "class_g = 'dunst'"
];

# Blur
blur = {
  method = "dual_kawase";
  strength = 7;
};
blur-background = true;
blur-background-frame = true;
blur-background-fixed = true;
blur-background-exclude = [
  "class_g = 'i3bar'",
  "class_g = 'rofi'",
  "class_g = 'dunst'"
];

# Fade
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 10;

# Opacity
active-opacity = 1.0;
inactive-opacity = 0.98;
inactive-opacity-override = false;
inactive-dim = 0.0;

# Opacity rules
opacity-rule = [
  "100:class_g = 'i3bar'",
  "100:class_g = 'rofi'",
  "100:class_g = 'dunst'"
];