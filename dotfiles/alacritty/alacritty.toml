[env]
TERM = "xterm-256color"

[window]
opacity = 0.95
padding = { x = 10, y = 10 }

[font]
normal = { family = "FiraCode Nerd Font Mono", style = "Regular" }
size = 14

[cursor]
style = { shape = "Beam", blinking = "On" }
blink_interval = 750

[selection]
save_to_clipboard = true

[colors]
primary = { background = "#1e1e2e", foreground = "#cdd6f4" }
cursor = { text = "#11111b", cursor = "#f5e0dc" }
selection = { text = "#cdd6f4", background = "#414356" }

normal = {
  black = "#45475a",
  red = "#f38ba8",
  green = "#a6e3a1",
  yellow = "#f9e2af",
  blue = "#89b4fa",
  magenta = "#f5c2e7",
  cyan = "#94e2d5",
  white = "#bac2de",
}

bright = {
  black = "#585b70",
  red = "#f38ba8",
  green = "#a6e3a1",
  yellow = "#f9e2af",
  blue = "#89b4fa",
  magenta = "#f5c2e7",
  cyan = "#94e2d5",
  white = "#a6adc8",
}

indexed_colors = [
  { index = 16, color = "#fab387" },
  { index = 17, color = "#f5e0dc" },
]
