[theme]
theme = "native"

[icons]
icons = "awesome6"

[[block]]
block = "pomodoro"
notify_cmd = "notify-send 'Pomodoro' '{msg}'"
blocking_cmd = false
[block.icons_overrides]
pomodoro = ""

[[block]]
block = "custom"
command = "pomodoro-task show"
watch_files = ["~/.cache/pomodoro-task"]
interval = "once"
format = " $text "
[[block.click]]
button = "left"
cmd = "pomodoro-task set"
[[block.click]]
button = "right"
cmd = "pomodoro-task clear"

[[block]]
block = "custom"
command = "lofi status"
interval = 5
[[block.click]]
button = "left"
cmd = "lofi toggle"
[[block.click]]
button = "right"
cmd = "lofi stop"

[[block]]
block = "custom"
interval = 2
command = '''read -r _ u1 n1 s1 i1 _ < /proc/stat; sleep 0.3; read -r _ u2 n2 s2 i2 _ < /proc/stat; used=$(( (u2-u1)+(n2-n1)+(s2-s1) )); idle=$((i2-i1)); total=$((used+idle)); [ "$total" -gt 0 ] && cpu=$((used*100/total)) || cpu=0; mt=$(awk "/MemTotal/{print \$2}" /proc/meminfo); ma=$(awk "/MemAvailable/{print \$2}" /proc/meminfo); ram=$(( (mt-ma)*100/mt )); vram=$(nvidia-smi --query-gpu=memory.used,memory.total --format=csv,noheader,nounits | awk -F', ' '{printf "%d", $1*100/$2}'); printf " CPU %d%%  RAM %d%%  VRAM %d%% " "$cpu" "$ram" "${vram:-0}"'''
[[block.click]]
button = "left"
cmd = "alacritty -e top"

[[block]]
block = "sound"
format = " $icon {$volume|} "
[block.icons_overrides]
volume_muted = "󰝟"
[[block.click]]
button = "left"
cmd = "pavucontrol"
[[block.click]]
button = "right"
action = "toggle_mute"

[[block]]
block = "battery"
interval = 10
format = " $icon $percentage "
full_format = " $icon $percentage "
missing_format = ""

[[block]]
block = "time"
interval = 1
format = " $timestamp.datetime(f:'%a %d/%m/%y %H:%M') "
[[block.click]]
button = "left"
cmd = "calendar-popup"
