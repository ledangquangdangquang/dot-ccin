[theme]
theme = "ctp-mocha"
[theme.overrides]
idle_bg = "#313244"
separator = ""

[icons]
icons = "awesome6"

[[block]]
block = "pomodoro"
notify_cmd = "notify-send 'Pomodoro' '{msg}'"
blocking_cmd = false
[block.icons_overrides]
pomodoro = ""

[[block]]
block = "custom"
command = "pomodoro-task show"
watch_files = ["~/.cache/pomodoro-task"]
interval = "once"
format = " $text "
[[block.click]]
button = "left"
cmd = "pomodoro-task set"
[[block.click]]
button = "right"
cmd = "pomodoro-task clear"

[[block]]
block = "custom"
command = "lofi status"
format = " $text.str() "
signal = 8
interval = 5
[[block.click]]
button = "left"
cmd = "lofi click"
[[block.click]]
button = "middle"
cmd = "lofi pick"
[[block.click]]
button = "right"
cmd = "lofi stop"

[[block]]
block = "custom"
interval = 2
command = '''read -r _ u1 n1 s1 i1 _ < /proc/stat; sleep 0.3; read -r _ u2 n2 s2 i2 _ < /proc/stat; used=$(( (u2-u1)+(n2-n1)+(s2-s1) )); idle=$((i2-i1)); total=$((used+idle)); [ "$total" -gt 0 ] && cpu=$((used*100/total)) || cpu=0; mt=$(awk "/MemTotal/{print \$2}" /proc/meminfo); ma=$(awk "/MemAvailable/{print \$2}" /proc/meminfo); ram=$(( (mt-ma)*100/mt )); vram=$(nvidia-smi --query-gpu=memory.used,memory.total --format=csv,noheader,nounits | awk -F', ' '{printf "%d", $1*100/$2}'); printf "  %d%%  󰍛 %d%%  󰢮 %d%% " "$cpu" "$ram" "${vram:-0}"'''
[[block.click]]
button = "left"
cmd = "alacritty --class htop -e htop"

[[block]]
block = "net"
device = "^wl"
format = " $icon {$ssid|} "
missing_format = " 󰤭 "
[[block.click]]
button = "left"
cmd = "alacritty --class wifitui -e wifitui"

[[block]]
block = "custom"
interval = 5
command = '''bluetoothctl show | grep -q 'Powered: yes' || { echo " 󰂲 "; exit; }; d=$(bluetoothctl devices Connected | cut -d' ' -f3- | head -1); [ -n "$d" ] && echo " 󰂱 $d " || echo " 󰂯 "'''
[[block.click]]
button = "left"
cmd = "alacritty --class bluetui -e bluetui"

# custom instead of "sound": Bluetooth hw-volume sinks emit no pulse change events, so the sound block goes stale
[[block]]
block = "custom"
interval = 2
signal = 1
command = '''pactl get-sink-mute @DEFAULT_SINK@ | grep -q yes && { echo " 󰝟 "; exit; }; v=$(pactl get-sink-volume @DEFAULT_SINK@ | grep -o '[0-9]*%' | head -1 | tr -d %); if [ "$v" -lt 34 ]; then i=""; elif [ "$v" -lt 67 ]; then i=""; else i=""; fi; echo " $i $v% "'''
[[block.click]]
button = "left"
cmd = "pavucontrol"
[[block.click]]
button = "right"
cmd = "system-control volume-mute"
[[block.click]]
button = "up"
cmd = "system-control volume-up"
[[block.click]]
button = "down"
cmd = "system-control volume-down"

[[block]]
block = "battery"
interval = 10
format = " $icon $percentage "
full_format = " $icon $percentage "
missing_format = ""

[[block]]
block = "time"
interval = 1
format = " $timestamp.datetime(f:'%a %d/%m/%y %H:%M') "
[[block.click]]
button = "left"
cmd = "calendar-popup"
