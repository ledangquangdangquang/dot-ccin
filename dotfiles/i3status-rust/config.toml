[theme]
theme = "native"

[icons]
icons = "awesome6"

[[block]]
block = "cpu"
interval = 2
format = " CPU $utilization "
info_cpu = 30
warning_cpu = 60
critical_cpu = 90
[[block.click]]
button = "left"
cmd = "alacritty -e btop"

[[block]]
block = "memory"
interval = 5
format = " RAM $mem_used_percents.eng(w:2) "
warning_mem = 80
critical_mem = 95
[[block.click]]
button = "left"
cmd = "alacritty -e btop"

[[block]]
block = "battery"
interval = 10
format = " $icon $percentage "
full_format = " $icon $percentage "
missing_format = ""

[[block]]
block = "custom"
command = '''state=$(fcitx5-remote 2>/dev/null); if [ "$state" = "2" ]; then echo VN; else echo EN; fi'''
interval = 1
[[block.click]]
button = "left"
cmd = "fcitx5-remote -t"

[[block]]
block = "net"
device = "^wl"
interval = 2
format = " $icon $signal_strength "
inactive_format = " $icon "
missing_format = ""
[[block.click]]
button = "left"
cmd = "alacritty -e nmtui"
# cmd = "wifi-menu"

[[block]]
block = "custom"
command = "b=$(bluetoothctl show 2>/dev/null | grep -q 'Powered: yes' && echo on || echo off); [ \"$b\" = on ] && c=$(bluetoothctl devices Connected 2>/dev/null | grep -q . && echo 󰂱 || echo 󰂲) || c=󰂲; echo \"$c BT\""
interval = 5
[[block.click]]
button = "left"
cmd = "alacritty -e bluetui"
# cmd = "bluetooth-menu"

[[block]]
block = "sound"
format = " $icon $volume "
[[block.click]]
button = "left"
cmd = "pavucontrol"

[[block]]
block = "time"
interval = 1
format = " $timestamp.datetime(f:'%a %d/%m/%y %H:%M') "
