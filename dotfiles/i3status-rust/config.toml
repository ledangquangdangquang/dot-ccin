[theme]
theme = "native"

[icons]
icons = "awesome6"

[[block]]
block = "pomodoro"
notify_cmd = "notify-send 'Pomodoro' '{msg}'"
blocking_cmd = false
[block.icons_overrides]
pomodoro = ""

[[block]]
block = "custom"
command = "pomodoro-task show"
watch_files = ["~/.cache/pomodoro-task"]
interval = "once"
format = " $text "
[[block.click]]
button = "left"
cmd = "pomodoro-task set"
[[block.click]]
button = "right"
cmd = "pomodoro-task clear"

[[block]]
block = "custom"
command = "lofi status"
interval = 5
[[block.click]]
button = "left"
cmd = "lofi toggle"
[[block.click]]
button = "right"
cmd = "lofi stop"

[[block]]
block = "custom"
interval = 2
command = '''read -r _ u1 n1 s1 i1 _ < /proc/stat; sleep 0.3; read -r _ u2 n2 s2 i2 _ < /proc/stat; used=$(( (u2-u1)+(n2-n1)+(s2-s1) )); idle=$((i2-i1)); total=$((used+idle)); [ "$total" -gt 0 ] && cpu=$((used*100/total)) || cpu=0; mt=$(awk "/MemTotal/{print \$2}" /proc/meminfo); ma=$(awk "/MemAvailable/{print \$2}" /proc/meminfo); ram=$(( (mt-ma)*100/mt )); printf " CPU %d%%  RAM %d%% " "$cpu" "$ram"'''
[[block.click]]
button = "left"
cmd = "alacritty -e btop"

[[block]]
block = "custom"
command = '''state=$(fcitx5-remote 2>/dev/null); if [ "$state" = "2" ]; then echo VN; else echo EN; fi'''
interval = 1
[[block.click]]
button = "left"
cmd = "fcitx5-remote -t"

[[block]]
block = "net"
device = "^wl"
interval = 2
format = " $icon $signal_strength "
inactive_format = " $icon "
missing_format = ""
[[block.click]]
button = "left"
cmd = "alacritty -e nmtui"
# cmd = "wifi-menu"

[[block]]
block = "custom"
command = "b=$(bluetoothctl show 2>/dev/null | grep -q 'Powered: yes' && echo on || echo off); [ \"$b\" = on ] && c=$(bluetoothctl devices Connected 2>/dev/null | grep -q . && echo 󰂱 || echo 󰂲) || c=󰂲; echo \"$c BT\""
interval = 5
[[block.click]]
button = "left"
cmd = "alacritty -e bluetui"
# cmd = "bluetooth-menu"

[[block]]
block = "sound"
format = " $icon $volume "
[[block.click]]
button = "left"
cmd = "pavucontrol"

[[block]]
block = "battery"
interval = 10
format = " $icon $percentage "
full_format = " $icon $percentage "
missing_format = ""

[[block]]
block = "time"
interval = 1
format = " $timestamp.datetime(f:'%a %d/%m/%y %H:%M') "
[[block.click]]
button = "left"
cmd = "calendar-popup"
