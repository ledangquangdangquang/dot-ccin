name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  nix:
    name: Nix flake
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check formatting
        run: |
          nix fmt
          git diff --exit-code -- '*.nix'

      - name: Check flake
        run: nix flake check
